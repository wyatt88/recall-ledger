[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-ledger"
version = "0.4.0"
description = "Local IPC client and Claude Code, ChatGPT, Codex, KiroCrew and OpenCode adapters for RecallLedger"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
recall-ledger-claude = "recall_ledger.claude_code:main"
recall-ledger-chatgpt = "recall_ledger.chatgpt:main"
recall-ledger-codex = "recall_ledger.codex:main"
recall-ledger-kirocrew = "recall_ledger.kirocrew:main"
recall-ledger-opencode = "recall_ledger.opencode:main"
recall-ledger-handoff = "recall_ledger.handoff:main"

[tool.setuptools]
packages = ["recall_ledger"]

[tool.setuptools.package-data]
recall_ledger = ["resources/*.mjs"]
