name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Set up Node for OpenCode protocol fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Test EKS preflight and sandbox probes
        run: python3 -m unittest discover -s tools/tests -v
      - name: Test sandbox bootstrap, manifests and guarded egress
        run: python3 -m unittest discover -s infra/eks/sandbox -p 'test_*.py' -v
      - name: Build Python wheel with local plugin runtime
        run: python3 -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/recall-wheel" ./sdk/python
      - name: Test Python SDK, local adapters and isolated wheel
        env:
          RECALL_LEDGER_WHEEL: ${{ runner.temp }}/recall-wheel/recall_ledger-0.4.0-py3-none-any.whl
        run: PYTHONPATH=sdk/python RECALL_LEDGER_BIN="$PWD/target/debug/recall-ledger" python3 -m unittest discover -s sdk/python/tests -v
      - name: Test OpenCode protocol fixtures
        run: node --test integrations/opencode/tests/plugin.test.mjs
      - name: Run portable migration and handoff workflow
        run: PYTHONPATH=sdk/python RECALL_LEDGER_BIN="$PWD/target/debug/recall-ledger" python3 examples/migration_handoff.py
      - name: Run source preservation and repair regressions
        run: PYTHONPATH=sdk/python RECALL_LEDGER_BIN="$PWD/target/debug/recall-ledger" python3 examples/fidelity_regression.py
      - name: Build release binary
        run: cargo build --release --locked
      - name: Run synthetic workflow
        run: bash examples/workflow.sh
      - name: Run grouping mechanism example
        run: cargo run --locked --example partition_probe
  msrv:
    name: Minimum Rust (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install minimum Rust
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Test locked dependencies and code
        run: cargo +1.89.0 test --locked --all-targets
